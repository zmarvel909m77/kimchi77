# Local production-like stack (API + bot webhook on one process).
# Usage:
#   cp .env.example .env   # set TELEGRAM_BOT_TOKEN + WEBAPP_URL (public HTTPS)
#   docker compose up --build
# Optional: set DATABASE_URL to use Postgres instead of the SQLite volume.
services:
  game-bot:
    build: .
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_HOST: "0.0.0.0"
      BOT_MODE: webhook
      ALLOW_DEV_SCORE_SUBMIT: "false"
      DATABASE_PATH: /data/gamebot.sqlite
      DATABASE_URL: ${DATABASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_PATH: ${TELEGRAM_WEBHOOK_PATH:-/telegram/webhook}
    volumes:
      - gamebot-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  gamebot-data:
