<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Rocket Bird — GAME BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">Rocket Bird</div>
        <div id="hudScore" class="hud">0</div>
      </header>
      <canvas id="game" width="390" height="640" aria-label="Rocket Bird o‘yini"></canvas>
      <div id="overlay" class="overlay">
        <div class="panel">
          <h1 id="overlayTitle">Rocket Bird</h1>
          <p id="overlayText">Tegin yoki bo‘sh joy — raketa uchadi. Quvurlardan o‘ting!</p>
          <p id="overlayScore" class="hidden"></p>
          <p id="submitStatus" class="status"></p>
          <button id="primaryBtn" type="button">Boshlash</button>
        </div>
      </div>
    </div>
    <script src="./game.js" type="module"></script>
  </body>
</html>
