<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Magazin — GAME BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #09070f;
        --bg1: #120e1c;
        --text: #ffffff;
        --muted: #a89bc8;
        --accent: #c4b5fd;
        --card: rgba(43, 29, 95, 0.35);
        --line: rgba(180, 160, 230, 0.18);
        --font: "Manrope", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        color: var(--text);
        font-family: var(--font);
        background:
          radial-gradient(80% 60% at 20% 0%, rgba(139, 108, 240, 0.22), transparent 55%),
          linear-gradient(165deg, var(--bg1), var(--bg0) 60%);
        overscroll-behavior: none;
      }
      body {
        padding: 28px 20px 40px;
        display: grid;
        place-items: center;
      }
      main {
        width: min(420px, 100%);
        padding: 28px 24px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: var(--card);
        backdrop-filter: blur(10px);
        text-align: center;
      }
      .brand {
        margin: 0 0 6px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 14px;
        font-size: 1.7rem;
        letter-spacing: -0.02em;
        font-weight: 800;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 0.98rem;
      }
      p + p {
        margin-top: 12px;
      }
      .back {
        margin-top: 22px;
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        border-radius: 12px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">MCee77</p>
      <h1>Magazin</h1>
      <p>Hozircha resurslar yo‘q — omborimiz yangi imkoniyatlar bilan to‘ldirilmoqda.</p>
      <p>Tez orada bu yerda sovg‘alar paydo bo‘ladi.</p>
      <button type="button" class="back" id="backBtn">O‘yinlarga qaytish</button>
    </main>
    <script>
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
          tg.ready();
          tg.expand();
          try {
            if (typeof tg.disableVerticalSwipes === "function") {
              tg.disableVerticalSwipes();
            }
          } catch (_) {}
        }
        document.getElementById("backBtn").addEventListener("click", function () {
          window.location.href = "../#oyinlar";
        });
      })();
    </script>
  </body>
</html>
