<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#b3e5fc">
  <title>Doodle Jump | GAME BOT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="wrap">
    <header class="hud">
      <a class="back" href="/app/#oyinlar" aria-label="Orqaga">‹</a>
      <div class="scorebox"><span>Ball</span><strong id="hudScore">0</strong></div>
      <div class="bestbox"><span>Rekord</span><strong id="hudBest">0</strong></div>
      <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pauza">Ⅱ</button>
    </header>
    <div class="game-area">
      <canvas id="gameCanvas" width="400" height="650"></canvas>
      <div id="loading">Yuklanmoqda...</div>
    </div>
    <div class="controls"><span>Chap tomonni bosing</span><span>O‘ng tomonni bosing</span></div>
    <section id="overlay" class="overlay">
      <div class="panel">
        <p class="eyebrow">GAME BOT</p>
        <h1 id="overlayTitle">Doodle Jump</h1>
        <p id="overlayText">Platformalarga sakrab yuqoriga ko‘tariling. Pastga tushib ketmang!</p>
        <p class="result">Ball: <b id="finalScore">0</b></p>
        <p id="submitStatus" class="status"></p>
        <button id="startBtn" type="button">O‘ynash</button>
      </div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
