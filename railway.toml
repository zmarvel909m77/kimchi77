# Railway — single service (Dockerfile). Set secrets in the dashboard:
#   TELEGRAM_BOT_TOKEN (required)
#   WEBAPP_URL (public https://….up.railway.app — set after first domain is known)
#   ALLOW_DEV_SCORE_SUBMIT=false
# Optional: TELEGRAM_WEBHOOK_SECRET, TELEGRAM_WEBHOOK_PATH, BOT_MODE
# Admin bot: ADMIN_BOT_TOKEN + ADMIN_TELEGRAM_IDS
#
# === Persistence (preferred: PostgreSQL) ===
# Trial plans often have no Volumes. Use Railway Postgres instead:
#   1. Project → New → Database → Add PostgreSQL
#   2. On the web/API service → Variables → Add Reference → DATABASE_URL
#      (from the Postgres service). Redeploy.
#   3. GET /healthz → databaseDriver:"postgres", dbPersistent:true
#   4. Users must /start the bot again (old ephemeral SQLite cannot be recovered).
#
# Volumes remain optional if DATABASE_URL is set. SQLite + Volume at /data
# is still supported when DATABASE_URL is unset (Hobby+).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
